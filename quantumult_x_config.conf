[policy]
# === 顶级策略组 ===
static = PROXY, MoreLogin-Pool-1, MoreLogin-Pool-2, MoreLogin-Pool-3, MoreLogin-Pool-4, HK-Auto, JP-Auto, SG-Auto, TW-Auto, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
static = FINAL, PROXY, DIRECT, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

# === MoreLogin 专用策略池 ===
# Pool 1: 主要使用DMIT香港节点+部分机场节点
url-test = MoreLogin-Pool-1, DMIT-HKD-51688, DMIT-HKD-51689, AIR-HK-PCCW-01, AIR-HK-PCCW-02, AIR-HK-HKBN-01, check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

# Pool 2: 主要使用WEEK香港节点+部分机场节点
url-test = MoreLogin-Pool-2, WEEK-HKW-51688, WEEK-HKW-51689, AIR-HK-PCCW-01, AIR-HK-PCCW-02, AIR-HK-HKBN-01, check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

# Pool 3: 主要使用日本节点
url-test = MoreLogin-Pool-3, FXT-JP, AIR-JP-Media-01, AIR-JP-Media-02, check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

# Pool 4: 主要使用新加坡节点
url-test = MoreLogin-Pool-4, AWS-SG, AIR-SG-Media-01, AIR-SG-Media-02, check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

# === 地区自动选择策略组 ===
url-test = HK-Auto, server-tag-regex=(?i)(港|HK|Hong Kong), check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
url-test = JP-Auto, server-tag-regex=(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan), check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
url-test = SG-Auto, server-tag-regex=(?i)(新加坡|坡|狮城|SG|Singapore), check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
url-test = TW-Auto, server-tag-regex=(?i)(台|TW|Taiwan), check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png

# === 应用专用策略组 ===
static = ChatGPT, JP-Auto, SG-Auto, TW-Auto, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
static = Telegram, HK-Auto, JP-Auto, SG-Auto, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
static = Apple, DIRECT, HK-Auto, JP-Auto, SG-Auto, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
static = Microsoft, DIRECT, HK-Auto, JP-Auto, SG-Auto, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
static = AdBlock, REJECT, DIRECT, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png

